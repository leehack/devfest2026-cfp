# The backend that serves this app. Only `env` is validated by firebase-tools —
# `runConfig` is read by the buildpack, so a typo there fails a rollout rather
# than the CLI.
runConfig:
  cpu: 1
  memoryMiB: 512
  concurrency: 80
  # Not 0 while a call is open. /c/{id} is `private, no-store` (see
  # next.config.ts), so every link preview is a real render — and Slack,
  # LinkedIn and iMessage give an unfurl about three seconds before they give up
  # and cache the failure, which leaves the link rendering as a bare URL for
  # good. A cold start is 1.5-3s. Drop this to 0 out of season.
  minInstances: 1
  # The ceiling is the bill guard, the same argument as maxInstances on the
  # callables. 4 x 80 is far past any real CFP.
  maxInstances: 4

env:
  # BUILD is the one that matters for NEXT_PUBLIC_*: Next inlines these into the
  # client bundle, so a runtime-only value is `undefined` in the browser and
  # initializeApp fails with auth/invalid-api-key. Keeping them build-only also
  # avoids making every cold start depend on six unnecessary secret reads.
  #
  # These ship to the browser and are not secrets. Secret Manager is here so that
  # nothing is committed to a public repo and so .env.production.local stops
  # being a manual step somebody has to remember.
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: next-public-firebase-api-key
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: next-public-firebase-auth-domain
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: next-public-firebase-project-id
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: next-public-firebase-storage-bucket
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: next-public-firebase-messaging-sender-id
    availability:
      - BUILD
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: next-public-firebase-app-id
    availability:
      - BUILD

  # Deliberately not set: NEXT_PUBLIC_FIREBASE_MEASUREMENT_ID. With no id the
  # analytics module is inert and the consent banner does not render, which is
  # the current production state. Adding it switches GA4 on for the first time —
  # a decision, not a migration detail.

  - variable: NEXT_PUBLIC_USE_EMULATORS
    value: 'false'
    availability:
      - BUILD

  # A required acknowledgement must name the policy being accepted. This is the
  # stable community-wide page rather than a year-specific DevFest URL.
  - variable: NEXT_PUBLIC_COC_URL
    value: https://gdgmontreal.com/code-of-conduct
    availability:
      - BUILD

  # The second home of the origin, and worth knowing about:
  # config/platform.publicUrl is what the functions build mailed links from (a
  # sign-in link is a bearer credential), and this is what crawlers read in the
  # canonical tag and the sitemap. They must agree.
  - variable: SITE_ORIGIN
    value: https://cfp.gdgmontreal.com
    availability:
      - BUILD
      - RUNTIME
  - variable: SITE_NAME
    value: DevFest Montréal
    availability:
      - BUILD
      - RUNTIME
