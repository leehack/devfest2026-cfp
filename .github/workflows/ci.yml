name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # The rules tests need a JVM.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions

      - run: npm run lint
      - run: npm run typecheck

      # `next build` refuses to run on the tracked `.env`, by design: it holds
      # `demo-` emulator placeholders, Next reads `.env` in every mode, and a
      # deployment built from them would look perfect and sign nobody in. See
      # assertPublicEnv in next.config.ts.
      #
      # So CI has to supply something, and it cannot be the real config — this
      # repo is public and the values live in Secret Manager. These are fake but
      # deliberately not `demo-`, which is the exact string both that guard and
      # check-bundle key on. Nothing here is deployed; the build is a compile and
      # prerender check, and the strings only get inlined.
      - run: npm run build
        env:
          NEXT_PUBLIC_FIREBASE_API_KEY: ci-not-a-real-key
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ci-build-check.firebaseapp.com
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ci-build-check
          NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: ci-build-check.appspot.com
          NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
          NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:0000000000000000000000'
          NEXT_PUBLIC_COC_URL: https://ci.invalid/code-of-conduct
          NEXT_PUBLIC_USE_EMULATORS: 'false'
          SITE_ORIGIN: https://ci.invalid

      # The two things Vite used to guarantee and nothing does now: no emulator
      # config in a client chunk, and no reachable call to the emulator sign-in.
      - run: npm run check:bundle

      - run: npm test

      # Rules are the enforcement boundary; a green build with broken rules is
      # worse than a red one.
      - run: npm run test:rules

  e2e:
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      # Each shard owns one complete emulator stack on its runner.
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium

      - name: Start the emulated stack
        run: |
          npm start > /tmp/stack.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 2
          done
          echo "stack never came up"; cat /tmp/stack.log; exit 1

      - name: Run shard ${{ matrix.shard }}/4
        run: npx playwright test --shard=${{ matrix.shard }}/4
        env:
          E2E_SKIP_NETWORK: '1'

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p test-results
          if [ -f /tmp/stack.log ]; then cp /tmp/stack.log test-results/stack.log; fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        continue-on-error: true
        with:
          name: e2e-shard-${{ matrix.shard }}-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # This live third-party probe is useful but must not gate a merge.
  sessionize:
    name: sessionize (nonblocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - run: npm ci
      - run: npm ci --prefix functions
      - run: npx playwright install --with-deps chromium

      - name: Start the emulated stack
        run: |
          npm start > /tmp/stack.log 2>&1 &
          for _ in $(seq 1 120); do
            curl -sf http://localhost:5173 >/dev/null && exit 0
            sleep 2
          done
          echo "stack never came up"; cat /tmp/stack.log; exit 1

      - name: Test live Sessionize integration
        run: npx playwright test tests/e2e/sessionize.spec.ts

      - name: Collect failure diagnostics
        if: failure()
        run: |
          mkdir -p test-results
          if [ -f /tmp/stack.log ]; then cp /tmp/stack.log test-results/stack.log; fi

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: sessionize-failure
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # Keep the existing required status name stable while the work runs in parallel.
  check:
    name: check
    if: ${{ always() }}
    needs: [validate, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Confirm required jobs passed
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          E2E_RESULT: ${{ needs.e2e.result }}
        run: |
          test "$VALIDATE_RESULT" = success
          test "$E2E_RESULT" = success
